<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font: 14px Arial, sans-serif; padding: 12px }
      input { box-sizing: border-box; width: 100%; margin: 8px 0 16px; padding: 8px }
      button { padding: 8px 12px }
      #status { overflow-wrap: anywhere }
    </style>
  </head>
  <body>
    <form id="login">
      <label for="password">FOLIO password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Create inventory</button>
      <button type="button" onclick="google.script.host.close()">Close</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <script>
      document.getElementById('login').addEventListener('submit', event => {
        event.preventDefault()
        const password = document.getElementById('password')
        const button = document.getElementById('submit')
        const status = document.getElementById('status')
        button.disabled = true
        status.textContent = 'Fetching FOLIO items…'
        google.script.run
          .withSuccessHandler(result => {
            if (!result.count) {
              status.textContent = 'No records matched your query.'
            } else if (result.truncated) {
              const total = Number.isInteger(result.totalRecords)
                ? ` of ${result.totalRecords}`
                : ''
              status.textContent = `Created ${result.sheetName} with ${result.count}${total} records (stopped at max rows limit).`
            } else {
              status.textContent = `Created ${result.sheetName} with ${result.count} records.`
            }
            button.disabled = false
          })
          .withFailureHandler(error => {
            status.textContent = error.message || 'Inventory creation failed.'
            button.disabled = false
          })
          .createInventory(password.value)
        password.value = ''
      })
    </script>
  </body>
</html>
